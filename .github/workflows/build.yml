name: Test and Release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: write

jobs:
  test:
    name: Test and Verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v5

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.x"

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install jq
        run: |
          if ! command -v jq > /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          jq --version
          bc --version | head -1

      - name: go vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [[ -n "$unformatted" ]]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go test
        run: go test -v ./...

      - name: Build binary
        run: go build -ldflags="-s -w" -o stats .

      # Layer 2: independent bc verification, reading the program's JSON via jq
      - name: Verify with bc (verify_stats.sh)
        run: ./verify_stats.sh

      # Layer 3: independent pure-Python reimplementation, compared field by field
      - name: Verify with Python (verify_stats.py)
        run: ./verify_stats.py

  release:
    name: GoReleaser Build
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set Up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.x"
        id: go

      - name: run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        env:
          HOMEBREW_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          distribution: goreleaser
          args: release --clean
